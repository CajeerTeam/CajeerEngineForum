groups:
  - name: cajeerengine.operations
    rules:
      - alert: CajeerEngineScrapeDown
        expr: up{job="cajeerengine"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "CajeerEngine metrics target is unavailable"
      - alert: CajeerEngineNotReady
        expr: cajeer_ready == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Forum is not ready; check maintenance and database"
      - alert: CajeerEngineDependencyUnavailable
        expr: cajeer_dependency_up{component=~"database|storage|queue|cache|search|scheduler|worker|backup|backup_automation|traces|update|ai|ai_admission|analytics|integrations|redis"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "CajeerEngine component {{ $labels.component }} is unhealthy"
      - alert: CajeerEngineRecentComponentFailures
        expr: (cajeer_recent_operation_failures >= 3) and (cajeer_recent_operations >= 5) and (cajeer_recent_operation_failures / clamp_min(cajeer_recent_operations, 1) >= 0.2)
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Recent {{ $labels.component }} operation failure ratio exceeds threshold"
      - alert: CajeerEngineNativeAnalyticsDelayed
        expr: cajeer_analytics_native_oldest_age_seconds > 300
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Unaggregated forum analytics events are delayed"
      - alert: CajeerEngineAIAdmissionExpired
        expr: cajeer_ai_admission_expired > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Forum AI admission leases have expired; inspect cleanup jobs"
      - alert: CajeerEngineHTTP5xx
        expr: sum by (instance) (rate(cajeer_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum by (instance) (rate(cajeer_http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "HTTP 5xx exceed 1% of observed requests"
      - alert: CajeerEngineQueueBacklog
        expr: cajeer_queue_oldest_ready_age_seconds > 300
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Oldest ready job has waited over 5 minutes"
      - alert: CajeerEngineFailedJobs
        expr: cajeer_queue_jobs{state="failed"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Failed jobs require operator attention"
      - alert: CajeerEngineDiskLow
        expr: cajeer_disk_free_bytes < 1073741824
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Storage disk has less than 1 GiB free"
      - alert: CajeerEngineTraceSpoolFull
        expr: cajeer_trace_spool_pending >= 900
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Trace spool near capacity; inspect collector"
      - alert: CajeerEngineOffsiteBackupPending
        expr: cajeer_backup_offsite_pending > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Encrypted off-site backup delivery is pending"
      - alert: CajeerEngineBackupAutomationStalled
        expr: time() - cajeer_backup_automation_last_check_timestamp_seconds > 3600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Scheduled backup has not reported for an hour"
      - alert: CajeerEngineQueueLeaseExpired
        expr: cajeer_queue_expired_reservations > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Queue reservations have expired; inspect workers before retrying"
      - alert: CajeerEngineSchedulerTaskStale
        expr: cajeer_scheduler_task_stale == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Scheduled task {{ $labels.task }} has stopped completing"
      - alert: CajeerEngineCriticalTelemetryMissing
        expr: (up{job="cajeerengine"} == 1) unless on(instance) cajeer_worker_last_success_timestamp_seconds
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Forum worker telemetry is missing despite successful metrics scrape"
      - alert: CajeerEngineQueueTelemetryMissing
        expr: (up{job="cajeerengine"} == 1) unless on(instance) cajeer_queue_expired_reservations
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Queue reservation telemetry unavailable"
