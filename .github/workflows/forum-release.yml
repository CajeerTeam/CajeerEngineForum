name: Publish Forum Edition release

on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful main push CI run ID (signed candidate)
        type: string
        required: true
      physical_run:
        description: Successful physical 10k/100k/1M qualification run ID
        type: string
        required: true
      drained_run:
        description: Successful interrupted update at drained checkpoint run ID
        type: string
        required: true
      activating_run:
        description: Successful interrupted update at activating checkpoint run ID
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: forum-edition-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish conventional GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: forum-production # Configure required independent reviewers in GitHub environment protection
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_RUN_ID: ${{ inputs.ci_run }}
      PHYSICAL_RUN_ID: ${{ inputs.physical_run }}
      DRAINED_RUN_ID: ${{ inputs.drained_run }}
      ACTIVATING_RUN_ID: ${{ inputs.activating_run }}
    steps:
      - name: Check out the exact passing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Validate release version and current main
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; r=json.load(open("release.json")); assert r["edition"] == "forum"; print(r["edition_version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a stable version: $version" >&2; exit 1; }
          tag="v$version"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
            echo "The passing CI commit is no longer at the tip of main; not releasing an older commit."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$existing" == false ]]; then
              echo "Release $tag already exists; no changes made."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$existing" == true ]] || exit 1
          fi
          # A prior interrupted draft may have created the tag. Never move it.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')" = "$RELEASE_SHA"
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        if: steps.version.outputs.should_publish == 'true'
        with:
          php-version: '8.4'
          extensions: sodium, zip
          coverage: none

      - name: Fetch exact workflow run metadata and physical evidence
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forum-physical"
          mkdir -p "$root/meta" "$root/load" "$root/drained" "$root/activating"
          for id in "$RELEASE_RUN_ID" "$PHYSICAL_RUN_ID" "$DRAINED_RUN_ID" "$ACTIVATING_RUN_ID"; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid workflow run ID' >&2; exit 1; }
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$root/meta/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PHYSICAL_RUN_ID" > "$root/meta/physical.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRAINED_RUN_ID" > "$root/meta/drained.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVATING_RUN_ID" > "$root/meta/activating.json"
          # Check repository/ref/commit/workflow/status before downloading any evidence.
          python3 - "$root/meta" "$GITHUB_REPOSITORY" "$RELEASE_SHA" <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('gate','tools/release-candidate-gate.py')
          gate = importlib.util.module_from_spec(spec); spec.loader.exec_module(gate)
          gate.validate_runs({name:json.loads((Path(sys.argv[1])/(name+'.json')).read_text()) for name in gate.WORKFLOWS},sys.argv[2],sys.argv[3])
          PY
          gh run download "$PHYSICAL_RUN_ID" --repo "$GITHUB_REPOSITORY" --name forum-physical-soak-evidence --dir "$root/load"
          gh run download "$DRAINED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name forum-physical-interrupted-update-drained --dir "$root/drained"
          gh run download "$ACTIVATING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name forum-physical-interrupted-update-activating --dir "$root/activating"

      - name: Download packages built by the passing CI run
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: forum-certified-release
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forum-release

      - name: Verify and publish normal source/dist release
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASE_TRUSTED_PUBLIC_B64: ${{ vars.FORUM_RELEASE_TRUSTED_PUBLIC_KEY_B64 }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARTIFACT_ROOT: ${{ runner.temp }}/forum-release
        run: |
          set -euo pipefail
          files=()
          for mode in source dist; do
            filename="cajeerengine-${VERSION}-${mode}.zip"
            mapfile -t matches < <(find "$ARTIFACT_ROOT" -type f -name "$filename")
            [[ "${#matches[@]}" == 1 ]] || { echo "Expected one $filename in CI artifacts" >&2; exit 1; }
            zip="${matches[0]}"
            checksum="$zip.sha256"
            [[ -s "$zip" && -s "$checksum" ]] || { echo "Missing archive/checksum: $filename" >&2; exit 1; }
            (cd "$(dirname "$zip")" && sha256sum --strict --check "$(basename "$checksum")")
            unzip -tqq "$zip"
            signature="$zip.sig"
            manifest="$(dirname "$zip")/cajeerengine-${VERSION}-${mode}.manifest.json"
            [[ -s "$signature" && -s "$manifest" ]] || { echo "Missing signed release sidecars: $filename" >&2; exit 1; }
            files+=("$zip" "$checksum" "$signature" "$manifest")
          done

          index="$ARTIFACT_ROOT/cajeerengine-${VERSION}-artifacts.json"
          [[ -s "$index" ]] || { echo 'Missing release artifact index' >&2; exit 1; }
          files+=("$index")

          # Do not publish a release certified with a disposable CI signing key.
          # Recheck the full signed, staged, migrated and recovered artifact using
          # the repository's independently provisioned publisher trust anchor.
          [[ -n "$RELEASE_TRUSTED_PUBLIC_B64" ]] || { echo 'Missing externally pinned publisher public key' >&2; exit 1; }
          pub="$RUNNER_TEMP/forum-trusted-release.pub"
          printf '%s\n' "$RELEASE_TRUSTED_PUBLIC_B64" > "$pub"
          cmp -s "$pub" "$ARTIFACT_ROOT/ci-release.pub" || { echo 'CI used a different signing key' >&2; exit 1; }
          php tools/verify-signed-release.php "$ARTIFACT_ROOT" "$pub"
          python3 tools/final-audit.py --directory "$ARTIFACT_ROOT" \
            --trusted-public-key "$pub" --version "$VERSION" --commit "$RELEASE_SHA"
          python3 tools/certification-evidence.py verify "$ARTIFACT_ROOT" --trusted-key "$pub"

          physical="$RUNNER_TEMP/forum-physical"
          python3 - "$physical/meta/ci.json" "$ARTIFACT_ROOT/ci-jobs.json" <<'PY'
          import json,sys
          run, jobs = (json.load(open(path)) for path in sys.argv[1:])
          if run['id'] != jobs['run_id'] or run['run_attempt'] != jobs['attempt']:
              raise SystemExit('Signed CI evidence not from selected successful run attempt')
          PY
          # Never trust the precomputed certificate alone: revalidate every raw report
          # against the exact signed CI dist, fixed SLOs and checked-out commit.
          python3 deploy/container/certify_load.py --release-dir "$ARTIFACT_ROOT" --trusted-public-key "$pub" --version "$VERSION" \
            --small "$physical/load/10k.json" --medium "$physical/load/100k.json" --soak "$physical/load/1m-soak.json" --output "$physical/verified.json"
          python3 tools/release-candidate-gate.py --repo "$GITHUB_REPOSITORY" --commit "$RELEASE_SHA" --version "$VERSION" \
            --metadata "$physical/meta" --load-directory "$physical/load" --physical "$physical/verified.json" --drained "$physical/drained/recovery.json" \
            --activating "$physical/activating/recovery.json" --dist "$ARTIFACT_ROOT/cajeerengine-${VERSION}-dist.zip"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"

          cat > "$RUNNER_TEMP/forum-release-notes.md" <<'NOTES'
          ## CajeerEngineForum 1.5.6 — Automatic Backup & Preflight

          Forum Edition 1.5.6 on CajeerEngine 2.1.0.

          - Exact-snapshot recovery rehearsal, backup capacity checks, optional encrypted off-site readback and maintenance policy revalidation before autonomous installation.
          - Physical 10k/100k/1M workload and 24-hour soak with fixed SLOs.
          - Dependency failures, durable queue replay, interrupted update recovery and post-fault workload.
          - Publication requires passing CI, disaster recovery and independent physical evidence for the exact signed artifact.
          - No new migration.
          NOTES

          # Attach the revalidated physical summary and CI certificate, without raw diagnostics.
          files+=("$ARTIFACT_ROOT/certification.json")
          cp "$physical/verified.json" "$physical/qualification.json"
          files+=("$physical/qualification.json")
          # Stage the exact verified candidate and resume only an identical draft.
          python3 tools/publish-qualified-release.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$RELEASE_SHA" \
            --notes "$RUNNER_TEMP/forum-release-notes.md" "${files[@]}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')" = "$RELEASE_SHA"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft
