      - name: Prepare isolated databases
        run: |
          php -r '$p=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=forum_install",getenv("DB_USERNAME"),getenv("DB_PASSWORD")); foreach (["forum_upgrade","forum_http","forum_identity","forum_test_phpunit","forum_test_core","forum_test_network","forum_test_load","forum_perf","forum_test_redis","forum_analytics"] as $db) $p->exec("CREATE DATABASE ".$db);'
