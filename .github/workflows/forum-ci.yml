name: Forum Edition CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORUM_CURRENT_VERSION: ${{ '1.3.3' }}
concurrency:
  group: forum-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependency audit and canonical artifact build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forum-candidate"
          test "$(php -r 'echo json_decode(file_get_contents("release.json"), true, 512, JSON_THROW_ON_ERROR)["edition_version"];')" = "$FORUM_CURRENT_VERSION"
          test "$(php -r 'echo json_decode(file_get_contents("release.json"), true, 512, JSON_THROW_ON_ERROR)["channel"];')" = "$([ "$FORUM_CURRENT_VERSION" = 1.0.0-rc.1 ] && echo rc || echo stable)"
          python3 tools/release-freeze.py
          composer validate --strict
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
          composer audit --locked --no-dev --format=json --abandoned=fail > "$RUNNER_TEMP/forum-candidate/dependency-audit.json"
          node admin/scripts/publish-admin-assets.mjs
          node admin/scripts/publish-admin-assets.mjs --check
          php bin/cajeer admin:assets --check
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          php tools/build-release.php --all --target-dir="$RUNNER_TEMP/forum-candidate" --json > "$RUNNER_TEMP/forum-candidate/build-report.json"
          php bin/cajeer release:verify --dist --strict --artifact="$RUNNER_TEMP/forum-candidate/cajeerengine-${FORUM_CURRENT_VERSION}-dist.zip"
          php bin/cajeer release:verify --strict --artifact="$RUNNER_TEMP/forum-candidate/cajeerengine-${FORUM_CURRENT_VERSION}-source.zip"
      - name: Sign exact ZIP bytes and verify Ed25519 against CI/release trust root
        env:
          RELEASE_SECRET_B64: ${{ secrets.FORUM_RELEASE_SIGNING_KEY_B64 }}
          RELEASE_PUBLIC_B64: ${{ vars.FORUM_RELEASE_TRUSTED_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/forum-candidate"
          umask 077
          key="$RUNNER_TEMP/forum-ci-release.secret"
          pub="$dir/ci-release.pub"
          # Only pull requests and non-publishing development branches may use disposable keys.
          # Main publishes conventional releases via workflow_run, so its CI MUST use
          # the publisher-owned key rather than a newly generated (untrusted) CI key.
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ -n "$RELEASE_SECRET_B64" && -n "$RELEASE_PUBLIC_B64" ]] || { echo 'Publishing refs require an external Ed25519 release signing key and trust root' >&2; exit 1; }
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              [[ "$GITHUB_REF" == "refs/tags/v${FORUM_CURRENT_VERSION}" ]] || { echo 'Tagged release version mismatch' >&2; exit 1; }
            fi
            printf '%s\n' "$RELEASE_SECRET_B64" > "$key"
            printf '%s\n' "$RELEASE_PUBLIC_B64" > "$pub"
          else
            php bin/cajeer release:keygen --secret-key="$key" --public-key="$pub"
          fi
          for mode in source dist; do
            php bin/cajeer release:sign --package="$dir/cajeerengine-${FORUM_CURRENT_VERSION}-$mode.zip" --secret-key="$key"
          done
          php tools/verify-signed-release.php "$dir" "$pub"
          shred -u "$key" || rm -f "$key"
      - uses: actions/upload-artifact@v4
        with:
          name: forum-signed-candidate
          path: ${{ runner.temp }}/forum-candidate/
          if-no-files-found: error
          retention-days: 14
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd, redis
          tools: composer:v2
