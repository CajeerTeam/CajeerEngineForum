        run: python tools/forum-tests/reliability_load.py --report storage/tmp/forum-ci/load
      - name: Network API and security regression (PostgreSQL)
        run: python tools/forum-tests/run.py --suite api --report storage/tmp/forum-ci/network
      - name: Forum 1.3.2 real PostgreSQL analytics stable acceptance
        env:
          DB_DATABASE: forum_analytics
        run: php tools/forum-analytics-stable-acceptance.php
      - name: Forum 1.3.2 real PostgreSQL AI chat acceptance
        env:
          DB_DATABASE: forum_analytics
          FORUM_TEST_DRIVER: pgsql
        run: php tools/forum-ai-chat-acceptance.php
      - name: Real SQL contextual thread AI acceptance (no skips)
