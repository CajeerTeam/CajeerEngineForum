          CE_QUEUE_PG_USER: forum_ci
          CE_QUEUE_PG_PASSWORD: 'ForumCI-Disposable-123!'
        run: php tools/queue-regression.php --pgsql
      - name: Physical populated upgrade, FTS/ACL plans and streamed bulk marks (PostgreSQL)
