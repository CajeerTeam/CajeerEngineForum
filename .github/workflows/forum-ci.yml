          FORUM_TEST_DRIVER: pgsql
        run: php tools/forum-thread-ai-acceptance.php
      - name: Real PostgreSQL AI forum search acceptance
        env:
          FORUM_TEST_DRIVER: pgsql
        run: php tools/forum-ai-search-acceptance.php
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-postgres-${{ matrix.postgres }}-evidence
          path: storage/tmp/forum-ci/
          if-no-files-found: warn
