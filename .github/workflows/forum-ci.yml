name: Forum Edition CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forum-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd, redis
          tools: composer:v2
          coverage: xdebug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer validate --no-check-publish
      - run: composer install --prefer-dist --no-interaction
      - name: PHP syntax and static analysis
        run: |
          find core tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpstan analyse core/Forum --level=3 --no-progress
      - name: PHPUnit and forum coverage
        run: |
          mkdir -p storage/tmp/forum-ci
          vendor/bin/phpunit --log-junit storage/tmp/forum-ci/phpunit.xml --fail-on-warning --fail-on-risky --fail-on-deprecation
          XDEBUG_MODE=coverage vendor/bin/phpunit tests/Forum --coverage-filter core/Forum --coverage-clover storage/tmp/forum-ci/coverage.xml
      - run: php tools/generate-api-sdk.php --check
      - run: php bin/cajeer api:lint --strict --json
      - run: node --check public/forum-assets/forum.js
      - run: node --check public/admin/assets/admin-app.js
      - run: python tools/forum-tests/acp_sql_regression.py
      - run: python tools/forum-tests/advanced_admin_sql_regression.py
      - run: python tools/forum-tests/theme_sql_regression.py
      - run: python tools/forum-tests/extension_sql_regression.py
      - run: python tools/forum-tests/migration_sql_regression.py
      - run: php tools/forum-migration-regression.php
      - run: php tools/forum-multi-migration-regression.php
      - run: php tools/forum-migration-reliability-regression.php --topics=1200
      - run: php tools/forum-extension-regression.php --database
      - run: php tools/forum-ecosystem-regression.php --database
      - run: php tools/extension-regression.php
      - run: php tools/forum-regression.php
      - run: php tools/forum-identity-regression.php
      - run: php tools/forum-core-regression.php
      - run: php tools/forum-installer-regression.php
      - name: Network API and security regression (SQLite)
        run: python tools/forum-tests/run.py --suite api --report storage/tmp/forum-ci/network
      - run: python tools/forum-tests/watch_sql_regression.py
      - run: python tools/forum-tests/conversation_sql_regression.py
      - run: python tools/forum-tests/activity_sql_regression.py
      - run: python tools/forum-tests/community_sql_regression.py
      - run: php tools/forum-content-regression.php
      - run: python tools/forum-tests/attachment_sql_regression.py
      - run: python tools/forum-tests/media_sql_regression.py
      - run: python tools/forum-tests/poll_sql_regression.py
      - run: python tools/forum-tests/draft_sql_regression.py
      - run: python tools/forum-tests/recycle_sql_regression.py
      - run: python tools/forum-tests/moderation_sql_regression.py
      - run: python tools/forum-tests/sanction_sql_regression.py
      - run: python tools/forum-tests/antispam_sql_regression.py
      - run: python tools/forum-tests/privacy_sql_regression.py
      - run: python tools/forum-tests/trust_sql_regression.py
      - run: python tools/forum-tests/safety_stable_sql_regression.py
      - run: python tools/forum-tests/search_sql_regression.py
      - run: python tools/forum-tests/advanced_search_sql_regression.py
      - run: php tools/forum-seo-unit-regression.php
      - run: python tools/forum-tests/seo_sql_regression.py
      - run: python tools/forum-tests/stable_search_seo_sql_regression.py
      - run: python tools/forum-tests/cache_sql_regression.py
      - run: python tools/forum-tests/performance_sql_regression.py
      - run: php tools/forum-reliability-regression.php
      - run: python tools/forum-tests/reliability_sql_regression.py
      - name: Concurrent HTTP load (SQLite)
        run: python tools/forum-tests/reliability_load.py --report storage/tmp/forum-ci/load
      - run: php tools/forum-feed-cursor-regression.php
      - run: php tools/queue-regression.php --redis
      - run: php tools/forum-redis-regression.php
      - run: python tools/forum-tests/smtp_regression.py
      - run: php tools/security-regression.php
      - run: php tools/release-regression.php
      - run: php tools/update-regression.php
      - run: php tools/update-policy-regression.php
      - run: php tools/github-release-regression.php
      - run: python deploy/container/test_update.py
      - run: php tools/build-release.php --dry-run --all --json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-sqlite-evidence
          path: storage/tmp/forum-ci/
          if-no-files-found: warn
          retention-days: 7
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: forum_ci
          POSTGRES_PASSWORD: 'ForumCI-Disposable-123!'
          POSTGRES_DB: forum_install
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forum_ci -d forum_install"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FORUM_TEST_DRIVER: pgsql
      FORUM_TEST_INSTALL_DB: forum_install
      FORUM_TEST_UPGRADE_DB: forum_upgrade
      FORUM_TEST_IDENTITY_DB: forum_identity
      FORUM_TEST_PHPUNIT_DB: forum_test_phpunit
      FORUM_TEST_CORE_DB: forum_test_core
      FORUM_TEST_NETWORK_DB: forum_test_network
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: forum_ci
      DB_PASSWORD: 'ForumCI-Disposable-123!'
      DB_SSLMODE: disable
      DB_DATABASE: forum_http
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd, redis
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --prefer-dist --no-interaction
      - name: Prepare isolated databases
        run: |
          php -r '$p=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=forum_install",getenv("DB_USERNAME"),getenv("DB_PASSWORD")); foreach (["forum_upgrade","forum_http","forum_identity","forum_test_phpunit","forum_test_core","forum_test_network","forum_test_load","forum_perf","forum_test_redis"] as $db) $p->exec("CREATE DATABASE ".$db);'
      - name: PHPUnit PostgreSQL integration
        run: |
          mkdir -p storage/tmp/forum-ci
          vendor/bin/phpunit tests/Forum --log-junit storage/tmp/forum-ci/phpunit.xml --fail-on-warning --fail-on-risky --fail-on-deprecation
      - run: php tools/forum-installer-regression.php
      - run: php tools/forum-regression.php
      - run: php tools/forum-identity-regression.php
      - run: php tools/forum-core-regression.php
      - run: php tools/forum-performance-pg-regression.php
      - run: php tools/forum-redis-regression.php
        env:
          DB_DATABASE: forum_test_redis
      - name: Concurrent HTTP load (PostgreSQL)
        env:
          FORUM_TEST_NETWORK_DB: forum_test_load
        run: python tools/forum-tests/reliability_load.py --report storage/tmp/forum-ci/load
      - name: Network API and security regression (PostgreSQL)
        run: python tools/forum-tests/run.py --suite api --report storage/tmp/forum-ci/network
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-postgres-${{ matrix.postgres }}-evidence
          path: storage/tmp/forum-ci/
          if-no-files-found: warn
          retention-days: 7
  mysql-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.4', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: 'ForumCI-Root-123!'
          MYSQL_DATABASE: forum_search
          MYSQL_USER: forum_ci
          MYSQL_PASSWORD: 'ForumCI-Disposable-123!'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pForumCI-Root-123!"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORUM_TEST_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: forum_search
      DB_USERNAME: forum_ci
      DB_PASSWORD: 'ForumCI-Disposable-123!'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - run: php tools/forum-search-db-regression.php
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --prefer-dist --no-interaction
      - run: python -m pip install -r tools/forum-tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tools/forum-tests/editor_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/poll_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/moderation_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/sanction_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/antispam_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/draft_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/advanced_search_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/acp_browser_regression.py --browser ${{ matrix.browser }}
      - run: python tools/forum-tests/theme_browser_regression.py --browser ${{ matrix.browser }}
      - name: Real browser E2E with SMTP
        run: python tools/forum-tests/run.py --suite browser --browser ${{ matrix.browser }} --report storage/tmp/forum-ci/browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-${{ matrix.browser }}-evidence
          path: storage/tmp/forum-ci/
          if-no-files-found: warn
          retention-days: 7
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: sqlite, postgres: '17', label: sqlite }
          - { driver: pgsql, postgres: '17', label: pg17 }
          - { driver: pgsql, postgres: '18', label: pg18 }
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: forum_ci
          POSTGRES_PASSWORD: 'ForumCI-Disposable-123!'
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forum_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: forum_ci
      DB_PASSWORD: 'ForumCI-Disposable-123!'
      FORUM_BASELINE_REF: ${{ vars.FORUM_BASELINE_REF || 'v0.8.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable PostgreSQL and matching backup clients
        if: matrix.driver == 'pgsql'
        run: |
          php -r '$p=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres",getenv("DB_USERNAME"),getenv("DB_PASSWORD")); foreach (["forum_test_release_clean","forum_test_release_upgrade"] as $db) $p->exec("CREATE DATABASE ".$db);'
          mkdir -p "$RUNNER_TEMP/pg-client"
          cat > "$RUNNER_TEMP/pg-client/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host --user "$(id -u):$(id -g)" --volume /tmp:/tmp --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD --env PGSSLMODE --env PGCONNECT_TIMEOUT "postgres:${{ matrix.postgres }}" "$(basename "$0")" "$@"
          SH
          chmod +x "$RUNNER_TEMP/pg-client/pg_dump"
          ln -s pg_dump "$RUNNER_TEMP/pg-client/pg_restore"
          ln -s pg_dump "$RUNNER_TEMP/pg-client/psql"
          echo "$RUNNER_TEMP/pg-client" >> "$GITHUB_PATH"
      - name: Build and verify physical 0.8.3 artifacts
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          mkdir -p storage/tmp/forum-ci/release
          php tools/build-release.php --all --target-dir="$RUNNER_TEMP/forum-current" --json > storage/tmp/forum-ci/release/build.json
          php bin/cajeer release:verify --dist --strict --artifact="$RUNNER_TEMP/forum-current/cajeerengine-0.8.3-dist.zip"
          php bin/cajeer release:verify --strict --artifact="$RUNNER_TEMP/forum-current/cajeerengine-0.8.3-source.zip"
      - name: Build authentic previous baseline from repository history
        run: |
          mkdir -p "$RUNNER_TEMP/forum-previous"
          ref="$FORUM_BASELINE_REF"
          # Prefer the immediately preceding release when its actual tag is available.
          if [ "$ref" = 'v0.8.2' ]; then
            for tag in v0.8.2 0.8.2; do
              if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then ref="refs/tags/$tag"; break; fi
            done
          fi
          git archive "$ref" | tar -x -C "$RUNNER_TEMP/forum-previous"
          cd "$RUNNER_TEMP/forum-previous"
          baseline=$(php -r '$v=json_decode(file_get_contents("release.json"),true,512,JSON_THROW_ON_ERROR)["edition_version"]; if($v!=="0.8.2") exit(1); echo $v;')
          echo "FORUM_BASELINE_VERSION=$baseline" >> "$GITHUB_ENV"
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/forum-previous-dist" --json
      - name: Clean install, live HTTP, identity and corrupt-ledger rejection
        env:
          FORUM_TEST_RELEASE_DB: forum_test_release_clean
        run: python tools/forum-tests/release_acceptance.py --driver ${{ matrix.driver }} --artifact "$RUNNER_TEMP/forum-current/cajeerengine-0.8.3-dist.zip" --report storage/tmp/forum-ci/release/clean
      - name: Signed upgrade from authentic baseline, recovery and rollback
        env:
          FORUM_TEST_RELEASE_DB: forum_test_release_upgrade
        run: python tools/forum-tests/release_acceptance.py --driver ${{ matrix.driver }} --artifact "$RUNNER_TEMP/forum-current/cajeerengine-0.8.3-dist.zip" --previous "$RUNNER_TEMP/forum-previous-dist/cajeerengine-${FORUM_BASELINE_VERSION}-dist.zip" --report storage/tmp/forum-ci/release/upgrade
      - name: Upload release acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-release-${{ matrix.label }}-evidence
          path: storage/tmp/forum-ci/release/
          if-no-files-found: warn
          retention-days: 7
  production-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forum_deploy_ci
          POSTGRES_PASSWORD: ForumDeployDisposable123
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forum_deploy_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - name: Install dedicated host runtime and native PostgreSQL 17 clients
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
            sudo install -d -m 0755 /usr/share/keyrings
            curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/keyrings/ce-pgdg.asc >/dev/null
            echo 'deb [signed-by=/usr/share/keyrings/ce-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/ce-forum-pgdg.list >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y nginx php8.4-fpm php8.4-pgsql php8.4-mbstring php8.4-xml php8.4-curl php8.4-gd php8.4-zip postgresql-client-17
          sudo systemctl stop php8.4-fpm || true
          sudo /usr/bin/php8.4 -v
          sudo /usr/sbin/php-fpm8.4 -v
      - name: Build physical signed-deployment candidate and run safety tests
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/forum-host" --json
          python3 deploy/test_production.py
          sudo install -d -o root -g root -m 0755 /var/lib/ce-forum-ci-source
          sudo cp -a "$GITHUB_WORKSPACE/." /var/lib/ce-forum-ci-source/
          sudo chown -R root:root /var/lib/ce-forum-ci-source
          sudo chmod -R go-w /var/lib/ce-forum-ci-source
      - name: Physical forum install, TLS, worker, signed upgrade and rollback
        env:
          CE_DEPLOY_DISPOSABLE: 'yes'
          CE_DB_USER: forum_deploy_ci
          CE_DB_PASSWORD: ForumDeployDisposable123
        run: |
          export CE_CERT_REPORT="$RUNNER_TEMP/forum-host/production-acceptance.json"
          sudo --preserve-env=CE_DEPLOY_DISPOSABLE,CE_DB_USER,CE_DB_PASSWORD,CE_CERT_REPORT bash /var/lib/ce-forum-ci-source/deploy/host-smoke.sh "$RUNNER_TEMP/forum-host/cajeerengine-0.8.3-dist.zip"
      - name: Upload production host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-production-host-evidence
          path: ${{ runner.temp }}/forum-host/production-acceptance.json
          if-no-files-found: warn
          retention-days: 7
  container-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        queue: [pgsql, redis]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, zip, dom, xml, curl, openssl, gd
          tools: composer:v2
      - name: Build signed dist and container profile
        env:
          CE_QUEUE: ${{ matrix.queue }}
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/forum-container-dist" --json
          php bin/cajeer release:keygen --secret-key="$RUNNER_TEMP/forum-container.secret" --public-key="$RUNNER_TEMP/forum-container.pub"
          artifact="$RUNNER_TEMP/forum-container-dist/cajeerengine-0.8.3-dist.zip"
          php bin/cajeer release:sign --package="$artifact" --secret-key="$RUNNER_TEMP/forum-container.secret"
          sha=$(sha256sum "$artifact" | cut -d' ' -f1)
          sh deploy/container/prepare.sh "$artifact" "$RUNNER_TEMP/forum-container.pub" "$sha" 0.8.3
          umask 077
          secret_dir="$RUNNER_TEMP/forum-container-secrets"
          mkdir -p "$secret_dir"
          for name in postgres-password db-password redis-password; do openssl rand -hex 32 > "$secret_dir/$name"; done
          printf 'Aa9%s\n' "$(openssl rand -hex 24)" > "$secret_dir/admin-password"
          openssl rand -base64 32 > "$secret_dir/backup-key"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=forum.test -addext subjectAltName=DNS:forum.test -keyout "$secret_dir/tls.key" -out "$secret_dir/tls.crt"
          cat > deploy/container/site.env <<EOF
          CE_RELEASE_VERSION=0.8.3
          CE_RELEASE_SHA256=$sha
          CE_DOMAIN=forum.test
          CE_ADMIN_EMAIL=container-admin@example.invalid
          CE_NAMESPACE=container-ci-$CE_QUEUE
          CE_SECRETS_DIR=$secret_dir
          CE_HTTPS_PORT=18443
          CE_BIND_ADDRESS=127.0.0.1
          CE_QUEUE_DRIVER=$CE_QUEUE
          EOF
          docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml config --quiet
          docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml build app gateway
      - name: Real install, HTTP, worker and persistent recreation
        env:
          CE_QUEUE: ${{ matrix.queue }}
        run: |
          set -euo pipefail
          dc() { docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml "$@"; }
          dc up -d gateway
          secret_dir="$RUNNER_TEMP/forum-container-secrets"
          smoke() { python deploy/container/smoke.py --domain forum.test --port 18443 --ca "$secret_dir/tls.crt" --email container-admin@example.invalid --password-file "$secret_dir/admin-password" --state "$RUNNER_TEMP/container-state.json" "$@"; }
          smoke
          dc exec -T app php bin/cajeer forum:runtime:check --json
          dc exec -T app php bin/cajeer forum:ecosystem:check --deep --json
          dc exec -T app php bin/cajeer queue:diagnostics --json
          dc exec -T scheduler php /opt/ce-container/runtime.php loop-health
          dc exec -T app sh -c 'test ! -w /srv/forum/core && test -w /srv/forum/storage/app && test "$(id -u)" = 33'
          dc exec -T app php bin/cajeer maintenance:on --json
          code=$(curl --noproxy '*' --resolve forum.test:18443:127.0.0.1 --cacert "$secret_dir/tls.crt" -s -o /dev/null -w '%{http_code}' https://forum.test:18443/forum-assets/forum.js)
          test "$code" = 503
          dc exec -T app php bin/cajeer maintenance:off --json
          if [ "$CE_QUEUE" = pgsql ]; then
            dc stop gateway worker scheduler
            dc exec -T app php bin/cajeer backup:create --json > "$RUNNER_TEMP/container-backup.json"
            backup=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/container-backup.json")
            dc exec -T app php bin/cajeer backup:verify --id="$backup" --json
          fi
          dc down
          dc up -d gateway
          smoke --verify-only
      - name: Stop disposable container project
        if: always()
        run: |
          if [ -f deploy/container/site.env ]; then
            docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml ps -a
            docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml logs --tail=50 init app worker scheduler gateway || true
            docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml down -v --remove-orphans
          fi
  container-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      FORUM_BASELINE_REF: ${{ vars.FORUM_BASELINE_REF || 'v0.8.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, zip, dom, xml, curl, openssl, gd
          tools: composer:v2
      - name: Build authentic old and target signed images
        run: |
          set -euo pipefail
          root="$PWD"; old="$RUNNER_TEMP/forum-container-old"
          mkdir -p "$old"
          ref="$FORUM_BASELINE_REF"
          if [ "$ref" = v0.8.2 ]; then
            for tag in v0.8.2 0.8.2; do
              if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then ref="refs/tags/$tag"; break; fi
            done
          fi
          git archive "$ref" | tar -x -C "$old"
          php -r 'exit(json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR)["edition_version"]==="0.8.2"?0:1);' "$old/release.json"
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/container-new-dist" --json
          (cd "$old"; composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader; php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/container-old-dist" --json)
          php bin/cajeer release:keygen --secret-key="$RUNNER_TEMP/container-upgrade.secret" --public-key="$RUNNER_TEMP/container-upgrade.pub"
          for v in old new; do
            if [ "$v" = old ]; then version=0.8.2; tree="$old"; else version=0.8.3; tree="$root"; fi
            artifact="$RUNNER_TEMP/container-$v-dist/cajeerengine-$version-dist.zip"
            php bin/cajeer release:sign --package="$artifact" --secret-key="$RUNNER_TEMP/container-upgrade.secret"
            sha=$(sha256sum "$artifact" | cut -d' ' -f1)
            sh "$tree/deploy/container/prepare.sh" "$artifact" "$RUNNER_TEMP/container-upgrade.pub" "$sha" "$version"
            printf 'CE_RELEASE_VERSION=%s\nCE_RELEASE_SHA256=%s\n' "$version" "$sha" > "$RUNNER_TEMP/container-$v.env"
          done
          umask 077
          secret_dir="$RUNNER_TEMP/container-upgrade-secrets"
          mkdir -p "$secret_dir"
          for name in postgres-password db-password redis-password; do openssl rand -hex 32 > "$secret_dir/$name"; done
          printf 'Aa9%s\n' "$(openssl rand -hex 24)" > "$secret_dir/admin-password"
          openssl rand -base64 32 > "$secret_dir/backup-key"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=forum.test -addext subjectAltName=DNS:forum.test -keyout "$secret_dir/tls.key" -out "$secret_dir/tls.crt"
          for v in old new; do
            cat >> "$RUNNER_TEMP/container-$v.env" <<ENV
          CE_DOMAIN=forum.test
          CE_ADMIN_EMAIL=container-admin@example.invalid
          CE_NAMESPACE=container-upgrade-ci
          CE_SECRETS_DIR=$secret_dir
          CE_HTTPS_PORT=18443
          CE_BIND_ADDRESS=127.0.0.1
          CE_QUEUE_DRIVER=pgsql
          ENV
          done
          docker compose --project-name forum-container-upgrade --env-file "$RUNNER_TEMP/container-old.env" -f "$old/deploy/container/compose.yaml" build app gateway
      - name: Signed upgrade, persistent data and explicit rollback
        run: |
          set -euo pipefail
          oldenv="$RUNNER_TEMP/container-old.env"; newenv="$RUNNER_TEMP/container-new.env"
          secret_dir="$RUNNER_TEMP/container-upgrade-secrets"
          dc() { docker compose --project-name forum-container-upgrade --env-file "$oldenv" -f deploy/container/compose.yaml "$@"; }
          op() { python deploy/container/update.py "$@" --project forum-container-upgrade --old-env "$oldenv" --new-env "$newenv" --state-dir "$RUNNER_TEMP/container-upgrade-state" --ca "$secret_dir/tls.crt"; }
          smoke() { python deploy/container/smoke.py --domain forum.test --port 18443 --ca "$secret_dir/tls.crt" --email container-admin@example.invalid --password-file "$secret_dir/admin-password" --state "$RUNNER_TEMP/container-upgrade-smoke.json" "$@"; }
          dc up -d gateway
          smoke --version 0.8.2
          op apply --dry-run
          smoke --version 0.8.2 --verify-only
          op apply
          smoke --version 0.8.3 --verify-only
          op status
          op rollback --yes
          smoke --version 0.8.2 --verify-only
          op status
      - name: Stop disposable project
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/container-old.env" ]; then
            docker compose --project-name forum-container-upgrade --env-file "$RUNNER_TEMP/container-old.env" -f deploy/container/compose.yaml logs --tail=50 init app worker scheduler gateway || true
            docker compose --project-name forum-container-upgrade --env-file "$RUNNER_TEMP/container-old.env" -f deploy/container/compose.yaml down -v --remove-orphans
          fi
  forum-required:
    runs-on: ubuntu-24.04
    if: always()
    needs: [test, postgres, mysql-search, browser, release, production-host, container-runtime, container-upgrade]
    steps:
      - name: Require every test matrix to pass
        env:
          SQLITE: ${{ needs.test.result }}
          POSTGRES: ${{ needs.postgres.result }}
          MYSQL: ${{ needs.mysql-search.result }}
          BROWSER: ${{ needs.browser.result }}
          RELEASE: ${{ needs.release.result }}
          HOST: ${{ needs.production-host.result }}
          CONTAINERS: ${{ needs.container-runtime.result }}
          CONTAINER_UPGRADE: ${{ needs.container-upgrade.result }}
        run: |
          test "$SQLITE" = success
          test "$POSTGRES" = success
          test "$MYSQL" = success
          test "$BROWSER" = success
          test "$RELEASE" = success
          test "$HOST" = success
          test "$CONTAINERS" = success
          test "$CONTAINER_UPGRADE" = success
