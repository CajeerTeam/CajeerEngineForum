  mysql-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.4', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: 'ForumCI-Root-123!'
          MYSQL_DATABASE: forum_search
          MYSQL_USER: forum_ci
          MYSQL_PASSWORD: 'ForumCI-Disposable-123!'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pForumCI-Root-123!"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORUM_TEST_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: forum_search
      DB_USERNAME: forum_ci
      DB_PASSWORD: 'ForumCI-Disposable-123!'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: Allow trigger function creation in disposable binlog-enabled MySQL 8.4
        if: matrix.image == 'mysql:8.4'
        run: |
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=mysql","root","ForumCI-Root-123!"); $p->exec("SET GLOBAL log_bin_trust_function_creators = 1"); if((int)$p->query("SELECT @@GLOBAL.log_bin_trust_function_creators")->fetchColumn()!==1)exit(1);'
      - run: php tools/forum-search-db-regression.php
      - name: Prepare disposable analytics schema (MySQL/MariaDB)
        run: |
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=mysql","root","ForumCI-Root-123!"); $p->exec("CREATE DATABASE forum_analytics CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"); $p->exec("GRANT ALL PRIVILEGES ON forum_analytics.* TO ".$p->quote("forum_ci")."@".$p->quote("%"));'
      - name: Forum 1.3.2 real MySQL/MariaDB analytics stable acceptance
        env:
          DB_DATABASE: forum_analytics
