  release:
    needs: [release-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: sqlite, postgres: '17', label: sqlite }
          - { driver: pgsql, postgres: '17', label: pg17 }
          - { driver: pgsql, postgres: '18', label: pg18 }
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: forum_ci
          POSTGRES_PASSWORD: 'ForumCI-Disposable-123!'
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forum_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: forum_ci
      DB_PASSWORD: 'ForumCI-Disposable-123!'
      FORUM_BASELINE_REF: ${{ vars.FORUM_BASELINE_REF || 'v0.8.7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable PostgreSQL and matching backup clients
        if: matrix.driver == 'pgsql'
        run: |
          php -r '$p=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres",getenv("DB_USERNAME"),getenv("DB_PASSWORD")); foreach (["forum_test_release_clean","forum_test_release_upgrade","forum_test_release_dr","forum_test_release_dr096"] as $db) $p->exec("CREATE DATABASE ".$db);'
          php -r '$p=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres",getenv("DB_USERNAME"),getenv("DB_PASSWORD")); $p->exec("CREATE ROLE forum_dr_target LOGIN CREATEDB NOSUPERUSER NOCREATEROLE PASSWORD ".$p->quote("ForumDR-Disposable-123!"));'
          mkdir -p "$RUNNER_TEMP/pg-client"
          cat > "$RUNNER_TEMP/pg-client/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host --user "$(id -u):$(id -g)" --volume /tmp:/tmp --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD --env PGSSLMODE --env PGCONNECT_TIMEOUT "postgres:${{ matrix.postgres }}" "$(basename "$0")" "$@"
          SH
          chmod +x "$RUNNER_TEMP/pg-client/pg_dump"
          ln -s pg_dump "$RUNNER_TEMP/pg-client/pg_restore"
          ln -s pg_dump "$RUNNER_TEMP/pg-client/psql"
          ln -s pg_dump "$RUNNER_TEMP/pg-client/createdb"
          echo "$RUNNER_TEMP/pg-client" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: forum-signed-candidate
          path: ${{ runner.temp }}/forum-current
      - name: Recheck identical signed release candidate in each matrix
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          mkdir -p storage/tmp/forum-ci/release
          php tools/verify-signed-release.php "$RUNNER_TEMP/forum-current" "$RUNNER_TEMP/forum-current/ci-release.pub"
      - name: Build authentic previous baseline from repository history
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forum-previous"
          ref="$FORUM_BASELINE_REF"
          if [ "$ref" = 'v0.8.7' ]; then
            for tag in v0.8.7 0.8.7; do
              if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then ref="refs/tags/$tag"; break; fi
            done
          fi
          if ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
            [[ "$GITHUB_REF" != refs/tags/* ]] || { echo "Missing tagged baseline $ref" >&2; exit 1; }
            ref=''
            for sha in $(git rev-list HEAD -- release.json); do
              found=$(git show "$sha:release.json" | php -r 'echo json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR)["edition_version"]??"";')
              if [ "$found" = 0.8.7 ]; then ref="$sha"; break; fi
            done
            [[ -n "$ref" ]] || { echo 'Cannot find historical 0.8.7 source' >&2; exit 1; }
            echo "Branch CI historical baseline 0.8.7: $ref (not a published tag)"
          fi
          git archive "$ref" | tar -x -C "$RUNNER_TEMP/forum-previous"
          cd "$RUNNER_TEMP/forum-previous"
          baseline=$(php -r '$v=json_decode(file_get_contents("release.json"),true,512,JSON_THROW_ON_ERROR)["edition_version"]; if($v!=="0.8.7") exit(1); echo $v;')
          echo "FORUM_BASELINE_VERSION=$baseline" >> "$GITHUB_ENV"
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/forum-previous-dist" --json
      - name: Build version-verified historical intermediate upgrades
        run: |
          set -euo pipefail
          history=(0.9.2 0.9.7 0.9.8 0.9.9)
          available=()
          for version in "${history[@]}"; do
            ref="refs/tags/v${version}"
            if ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
              [[ "$GITHUB_REF" != refs/tags/* ]] || { echo "Official upgrade certification requires historical tag: $ref" >&2; exit 1; }
              ref=''
              for sha in $(git rev-list HEAD -- release.json); do
                found=$(git show "$sha:release.json" | php -r 'echo json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR)["edition_version"]??"";')
                if [ "$found" = "$version" ]; then ref="$sha"; break; fi
              done
              if [ -z "$ref" ]; then
                echo "Branch CI: historical $version has no tag or commit; full tagged upgrade certification remains required"
                continue
              fi
              echo "Branch CI: upgrade $version uses authentic historical Git commit $ref"
            fi
            dir="$RUNNER_TEMP/forum-history/$version"
            mkdir -p "$dir"
            git archive "$ref" | tar -x -C "$dir"
            test "$(php -r 'echo json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR)["edition_version"];' "$dir/release.json")" = "$version"
            (cd "$dir"; composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader; php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/forum-intermediate-dist" --json)
            available+=("$version")
          done
          [[ ${#available[@]} -gt 0 ]] || { echo 'No intermediate upgrades tested' >&2; exit 1; }
          printf 'FORUM_HISTORY_VERSIONS=%s\n' "${available[*]}" >> "$GITHUB_ENV"
      - name: Clean install, live HTTP, identity and corrupt-ledger rejection
        env:
          FORUM_TEST_RELEASE_DB: forum_test_release_clean
        run: python tools/forum-tests/release_acceptance.py --driver ${{ matrix.driver }} --artifact "$RUNNER_TEMP/forum-current/cajeerengine-${FORUM_CURRENT_VERSION}-dist.zip" --report storage/tmp/forum-ci/release/clean
      - name: Signed upgrade from authentic baseline, recovery and rollback
        env:
          FORUM_TEST_RELEASE_DB: forum_test_release_upgrade
        run: |
          set -euo pipefail
          extra=()
          for version in $FORUM_HISTORY_VERSIONS; do
            extra+=(--intermediate "$RUNNER_TEMP/forum-intermediate-dist/cajeerengine-$version-dist.zip")
          done
          [[ ${#extra[@]} -ge 2 ]] || { echo 'No versioned intermediate artifacts available' >&2; exit 1; }
          python tools/forum-tests/release_acceptance.py --driver ${{ matrix.driver }} --artifact "$RUNNER_TEMP/forum-current/cajeerengine-${FORUM_CURRENT_VERSION}-dist.zip" --previous "$RUNNER_TEMP/forum-previous-dist/cajeerengine-${FORUM_BASELINE_VERSION}-dist.zip" "${extra[@]}" --report storage/tmp/forum-ci/release/upgrade
      - name: Cold recovery from authentic baseline after loss of source host and database
        env:
          FORUM_TEST_RELEASE_DB: forum_test_release_dr
          FORUM_DR_PASSWORD: ForumDR-Disposable-123!
        run: python tools/forum-tests/cold_recovery_acceptance.py --driver ${{ matrix.driver }} --artifact "$RUNNER_TEMP/forum-previous-dist/cajeerengine-${FORUM_BASELINE_VERSION}-dist.zip" --report storage/tmp/forum-ci/release/cold-recovery
      - name: "Disaster recovery: live-write backup, off-site filesystem, replacement host and verified HTTPS"
        env:
          FORUM_DR_DISPOSABLE: destroy-test-services
          FORUM_TEST_RELEASE_DB: forum_test_release_dr096
          FORUM_DR_PASSWORD: ForumDR-Disposable-123!
        run: |
          python tools/forum-tests/dr_certification.py \
            --driver ${{ matrix.driver }} --transport file \
            --release-dir "$RUNNER_TEMP/forum-current" \
            --trusted-public-key "$RUNNER_TEMP/forum-current/ci-release.pub" \
            --report storage/tmp/forum-ci/release/dr096-${{ matrix.label }}/result.json
      - name: Upload release acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-release-${{ matrix.label }}-evidence
          path: storage/tmp/forum-ci/release/
          if-no-files-found: warn
          retention-days: 7
  production-host:
    needs: [release-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forum_deploy_ci
          POSTGRES_PASSWORD: ForumDeployDisposable123
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forum_deploy_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - name: Install dedicated host runtime and native PostgreSQL 17 clients
        run: |
          sudo apt-get update
          # Ubuntu 24.04 ships PHP 8.3 by default. Host acceptance needs PHP 8.4 FPM.
          if ! apt-cache show php8.4-fpm php8.4-gd >/dev/null 2>&1; then
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update
          fi
          if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
            sudo apt-get install -y gnupg ca-certificates
            sudo install -d -m 0755 /usr/share/keyrings
            key_file="$(mktemp)"
            curl --fail --silent --show-error --location --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$key_file"
            gpg --show-keys --with-colons "$key_file" | grep -qi '^fpr:::::::::B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:' || { echo 'Unexpected PostgreSQL package signing key' >&2; rm -f "$key_file"; exit 1; }
            gpg --dearmor < "$key_file" | sudo tee /usr/share/keyrings/ce-pgdg.gpg >/dev/null
            rm -f "$key_file"
            echo 'deb [signed-by=/usr/share/keyrings/ce-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/ce-forum-pgdg.list >/dev/null
            sudo apt-get update
          fi
          # Launchpad occasionally returns transient 503 for an individual .deb.
          # Revalidate package indexes and retry, without accepting a partial install.
          for attempt in 1 2 3 4; do
            if sudo apt-get install -y -o Acquire::Retries=5 nginx php8.4-fpm php8.4-pgsql php8.4-mbstring php8.4-xml php8.4-curl php8.4-gd postgresql-client-17; then
              break
            fi
            if [ "$attempt" = 4 ]; then echo 'Dedicated host packages unavailable' >&2; exit 1; fi
            sleep $((attempt * 8))
            sudo apt-get update -o Acquire::Retries=5
          done
          sudo systemctl stop php8.4-fpm || true
          sudo /usr/bin/php8.4 -v
          sudo /usr/sbin/php-fpm8.4 -v
          # setup-php supplies zip on the CI host; verify it instead of relying
          # on an unavailable distro php8.4-zip APT package.
          php -r 'exit(extension_loaded("zip") ? 0 : 1);' 
      - uses: actions/download-artifact@v4
        with:
          name: forum-signed-candidate
          path: ${{ runner.temp }}/forum-host
      - name: Build authentic systemd upgrade baseline (tag or historical branch commit)
        run: |
          set -euo pipefail
          ref=refs/tags/v0.9.9
          expected=0.9.9
          if ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
            [[ "$GITHUB_REF" != refs/tags/* ]] || { echo 'Missing tagged systemd release baseline v0.9.9' >&2; exit 1; }
            # Branch CI is allowed to exercise real earlier Git trees, but not
            # to represent them as an officially certified signed release.
            ref=''
            for version in 0.9.9 0.9.8; do
              for sha in $(git rev-list HEAD -- release.json); do
                found=$(git show "$sha:release.json" | php -r 'echo json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR)["edition_version"]??"";')
                if [ "$found" = "$version" ]; then ref="$sha"; expected="$version"; break 2; fi
              done
            done
            [[ -n "$ref" ]] || { echo 'No authentic historical systemd baseline in Git history' >&2; exit 1; }
            echo "Branch CI systemd baseline: commit $ref, version $expected"
          fi
          dir="$RUNNER_TEMP/forum-systemd-old"
          mkdir -p "$dir"
          git archive "$ref" | tar -x -C "$dir"
          echo "FORUM_SYSTEMD_BASELINE=$expected" >> "$GITHUB_ENV"
          test "$(php -r 'echo json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR)["edition_version"];' "$dir/release.json")" = "$expected"
          (cd "$dir"; composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader; php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/forum-host" --json)
      - name: Verify canonical signed candidate and run host safety tests
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/verify-signed-release.php "$RUNNER_TEMP/forum-host" "$RUNNER_TEMP/forum-host/ci-release.pub"
          python3 deploy/test_production.py
          sudo install -d -o root -g root -m 0755 /var/lib/ce-forum-ci-source
          sudo cp -a "$GITHUB_WORKSPACE/." /var/lib/ce-forum-ci-source/
          sudo chown -R root:root /var/lib/ce-forum-ci-source
          sudo chmod -R go-w /var/lib/ce-forum-ci-source
      - name: Physical forum install, TLS, worker, signed upgrade and rollback
        env:
          CE_DEPLOY_DISPOSABLE: 'yes'
          CE_DB_USER: forum_deploy_ci
          CE_DB_PASSWORD: ForumDeployDisposable123
        run: |
          export CE_CERT_REPORT="$RUNNER_TEMP/forum-host/production-acceptance.json"
          sudo --preserve-env=CE_DEPLOY_DISPOSABLE,CE_DB_USER,CE_DB_PASSWORD,CE_CERT_REPORT bash /var/lib/ce-forum-ci-source/deploy/host-smoke.sh "$RUNNER_TEMP/forum-host/cajeerengine-${FORUM_CURRENT_VERSION}-dist.zip" "$RUNNER_TEMP/forum-host/cajeerengine-${FORUM_SYSTEMD_BASELINE}-dist.zip"
      - name: Upload production host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-production-host-evidence
          path: ${{ runner.temp }}/forum-host/production-acceptance.json
          if-no-files-found: warn
          retention-days: 7
  container-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        queue: [pgsql, redis]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, zip, dom, xml, curl, openssl, gd
          tools: composer:v2
      - name: Build signed dist and container profile
        env:
          CE_QUEUE: ${{ matrix.queue }}
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/forum-container-dist" --json
          php bin/cajeer release:keygen --secret-key="$RUNNER_TEMP/forum-container.secret" --public-key="$RUNNER_TEMP/forum-container.pub"
          artifact="$RUNNER_TEMP/forum-container-dist/cajeerengine-${FORUM_CURRENT_VERSION}-dist.zip"
          php bin/cajeer release:sign --package="$artifact" --secret-key="$RUNNER_TEMP/forum-container.secret"
          sha=$(sha256sum "$artifact" | cut -d' ' -f1)
          sh deploy/container/prepare.sh "$artifact" "$RUNNER_TEMP/forum-container.pub" "$sha" ${FORUM_CURRENT_VERSION}
          umask 077
          secret_dir="$RUNNER_TEMP/forum-container-secrets"
          mkdir -p "$secret_dir"
          for name in postgres-password db-password redis-password; do openssl rand -hex 32 > "$secret_dir/$name"; done
          printf 'Aa9%s\n' "$(openssl rand -hex 24)" > "$secret_dir/admin-password"
          openssl rand -base64 32 > "$secret_dir/backup-key"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=forum.test -addext subjectAltName=DNS:forum.test -keyout "$secret_dir/tls.key" -out "$secret_dir/tls.crt"
          cat > deploy/container/site.env <<EOF
          CE_RELEASE_VERSION=${FORUM_CURRENT_VERSION}
          CE_RELEASE_SHA256=$sha
          CE_DOMAIN=forum.test
          CE_ADMIN_EMAIL=container-admin@example.invalid
          CE_NAMESPACE=container-ci-$CE_QUEUE
          CE_SECRETS_DIR=$secret_dir
          CE_HTTPS_PORT=18443
          CE_BIND_ADDRESS=127.0.0.1
          CE_QUEUE_DRIVER=$CE_QUEUE
          CE_RATE_LIMIT_GLOBAL=10000
          CE_RATE_LIMIT_FORUM_SEARCH=10000
          EOF
          docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml config --quiet
          docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml build app gateway
      - name: Real install, HTTP, worker and persistent recreation
        env:
          CE_QUEUE: ${{ matrix.queue }}
        run: |
          set -euo pipefail
          dc() { docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml "$@"; }
          dc up -d gateway
          secret_dir="$RUNNER_TEMP/forum-container-secrets"
          smoke() { python deploy/container/smoke.py --domain forum.test --port 18443 --ca "$secret_dir/tls.crt" --email container-admin@example.invalid --password-file "$secret_dir/admin-password" --state "$RUNNER_TEMP/container-state.json" --version "$FORUM_CURRENT_VERSION" "$@"; }
          smoke
          python deploy/container/qualify.py --project forum-container-ci --env deploy/container/site.env --domain forum.test --port 18443 --ca "$secret_dir/tls.crt" --email container-admin@example.invalid --password-file "$secret_dir/admin-password" --state "$RUNNER_TEMP/container-state.json" --version ${FORUM_CURRENT_VERSION} --disposable destroy-test-services --seconds 60 --clients 8 --rate 10 --min-rps 5 --seed-posts 10000 --faults --report "$RUNNER_TEMP/forum-qualification.json"
          dc up -d --wait --wait-timeout 180 gateway
          sudo python3 deploy/container/operations.py --project forum-container-ci --env-file deploy/container/site.env --ca "$secret_dir/tls.crt" --tls-min-valid-days 1 --report "$RUNNER_TEMP/forum-operations.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/forum-operations.json"
          dc exec -T app php bin/cajeer forum:runtime:check --json
          dc exec -T app php bin/cajeer forum:ecosystem:check --deep --json
          dc exec -T app php bin/cajeer queue:diagnostics --json
          dc exec -T scheduler php /opt/ce-container/runtime.php loop-health
          dc exec -T app sh -c 'test ! -w /srv/forum/core && test -w /srv/forum/storage/app && test "$(id -u)" = 33'
          dc exec -T app php bin/cajeer maintenance:on --json
          code=$(curl --noproxy '*' --resolve forum.test:18443:127.0.0.1 --cacert "$secret_dir/tls.crt" -s -o /dev/null -w '%{http_code}' https://forum.test:18443/forum-assets/forum.js)
          test "$code" = 503
          dc exec -T app php bin/cajeer maintenance:off --json
          if [ "$CE_QUEUE" = pgsql ]; then
            dc stop gateway worker scheduler
            dc exec -T app php bin/cajeer backup:create --json > "$RUNNER_TEMP/container-backup.json"
            backup=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/container-backup.json")
            dc exec -T app php bin/cajeer backup:verify --id="$backup" --json
            cfg="$RUNNER_TEMP/forum-backup-config"; off="$RUNNER_TEMP/forum-backup-offsite"
            mkdir -p "$cfg" "$off"
            printf '%s\n' '{"namespace":"container-ci","interval_seconds":86400,"require_separate_device":false,"prune_offsite":true,"destination":{"type":"file","directory":"/offsite"}}' > "$cfg/policy.json"
            sudo chown -R 33:33 "$cfg" "$off"
            sudo chmod 700 "$cfg" "$off"; sudo chmod 600 "$cfg/policy.json"
            # Run as root for host path validation and Docker access; all backup I/O remains UID 33 inside container.
            sudo python3 deploy/container/backup.py build --project forum-container-ci --env-file deploy/container/site.env --config-dir "$cfg" --offsite-dir "$off"
            sudo python3 deploy/container/backup.py run --project forum-container-ci --env-file deploy/container/site.env --config-dir "$cfg" --offsite-dir "$off"
            dc exec -T app php bin/cajeer backup:automation:status --json > "$RUNNER_TEMP/auto-backup.json"
            # Verify the live installation and its authenticated off-site recovery cycle.
            dc up -d --wait --wait-timeout 180 gateway
            sudo python3 deploy/container/operations.py --project forum-container-ci --env-file deploy/container/site.env --ca "$secret_dir/tls.crt" --require-backup --require-integrity --tls-min-valid-days 1 --report "$RUNNER_TEMP/forum-operations-backup.json"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/forum-operations-backup.json"
            python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ok"] and r["pending"]==0 and r["latest_local_id"]==r["latest_offsite_id"]' "$RUNNER_TEMP/auto-backup.json"
            sudo find "$off" -type f -name '*.cebackup' | grep -q .
          fi
          dc down
          dc up -d gateway
          smoke --verify-only
      - name: Make operator evidence readable by the artifact uploader
        if: always()
        run: |
          # Failure injection may leave the report root-owned and mode 0600.
          # Preserve the evidence, but hand it back to the runner account.
          for report in "$RUNNER_TEMP"/forum-operations*.json; do
            if [ -f "$report" ]; then
              sudo chown "$(id -u):$(id -g)" "$report"
              chmod 0600 "$report"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-qualification-${{ matrix.queue }}
          path: |
            ${{ runner.temp }}/forum-qualification.json
            ${{ runner.temp }}/forum-operations*.json
          if-no-files-found: error
      - name: Stop disposable container project
        if: always()
        run: |
          if [ -f deploy/container/site.env ]; then
            docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml ps -a
            docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml logs --tail=50 init app worker scheduler gateway || true
            docker compose --project-name forum-container-ci --env-file deploy/container/site.env -f deploy/container/compose.yaml down -v --remove-orphans
          fi
  container-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      FORUM_BASELINE_REF: ${{ vars.FORUM_BASELINE_REF || 'v0.8.7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, zip, dom, xml, curl, openssl, gd
          tools: composer:v2
      - name: Build authentic old and target signed images
        run: |
          set -euo pipefail
          root="$PWD"; old="$RUNNER_TEMP/forum-container-old"
          mkdir -p "$old"
          ref="$FORUM_BASELINE_REF"
          baseline_version=0.8.7
          if [ "$FORUM_CURRENT_VERSION" = 1.0.0-rc.1 ]; then
            ref=refs/tags/v0.9.9; baseline_version=0.9.9
          fi
          echo "FORUM_COMPOSE_BASELINE=$baseline_version" >> "$GITHUB_ENV"
          if [ "$ref" = v0.8.7 ]; then
            for tag in v0.8.7 0.8.7; do
              if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then ref="refs/tags/$tag"; break; fi
            done
          fi
          if ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
            # Branch CI can test the authentic versioned commit when legacy
            # releases have not yet been tagged. Published tags stay fail-closed.
            [[ "$GITHUB_REF" != refs/tags/* ]] || { echo "Missing historical release tag: $ref" >&2; exit 1; }
            ref=''
            for sha in $(git rev-list HEAD -- release.json); do
              found=$(git show "$sha:release.json" | php -r 'echo json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR)["edition_version"]??"";')
              if [ "$found" = "$baseline_version" ]; then ref="$sha"; break; fi
            done
            [[ -n "$ref" ]] || { echo "No historical commit for $baseline_version" >&2; exit 1; }
            echo "Branch CI baseline: immutable commit $ref (not an official signed historical tag)"
          fi
          git archive "$ref" | tar -x -C "$old"
          php -r 'exit(json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR)["edition_version"]===$argv[2]?0:1);' "$old/release.json" "$baseline_version"
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/container-new-dist" --json
          (cd "$old"; composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader; php tools/build-release.php --dist --target-dir="$RUNNER_TEMP/container-old-dist" --json)
          php bin/cajeer release:keygen --secret-key="$RUNNER_TEMP/container-upgrade.secret" --public-key="$RUNNER_TEMP/container-upgrade.pub"
          for v in old new; do
            if [ "$v" = old ]; then version="$baseline_version"; tree="$old"; else version=${FORUM_CURRENT_VERSION}; tree="$root"; fi
            artifact="$RUNNER_TEMP/container-$v-dist/cajeerengine-$version-dist.zip"
            php bin/cajeer release:sign --package="$artifact" --secret-key="$RUNNER_TEMP/container-upgrade.secret"
            sha=$(sha256sum "$artifact" | cut -d' ' -f1)
            sh "$tree/deploy/container/prepare.sh" "$artifact" "$RUNNER_TEMP/container-upgrade.pub" "$sha" "$version"
            printf 'CE_RELEASE_VERSION=%s\nCE_RELEASE_SHA256=%s\n' "$version" "$sha" > "$RUNNER_TEMP/container-$v.env"
          done
          umask 077
          secret_dir="$RUNNER_TEMP/container-upgrade-secrets"
          mkdir -p "$secret_dir"
          for name in postgres-password db-password redis-password; do openssl rand -hex 32 > "$secret_dir/$name"; done
          printf 'Aa9%s\n' "$(openssl rand -hex 24)" > "$secret_dir/admin-password"
          openssl rand -base64 32 > "$secret_dir/backup-key"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=forum.test -addext subjectAltName=DNS:forum.test -keyout "$secret_dir/tls.key" -out "$secret_dir/tls.crt"
          for v in old new; do
            cat >> "$RUNNER_TEMP/container-$v.env" <<ENV
          CE_DOMAIN=forum.test
          CE_ADMIN_EMAIL=container-admin@example.invalid
          CE_NAMESPACE=container-upgrade-ci
          CE_SECRETS_DIR=$secret_dir
          CE_HTTPS_PORT=18443
          CE_BIND_ADDRESS=127.0.0.1
          CE_QUEUE_DRIVER=pgsql
          ENV
          done
          docker compose --project-name forum-container-upgrade --env-file "$RUNNER_TEMP/container-old.env" -f "$old/deploy/container/compose.yaml" build app gateway
      - name: Signed upgrade, persistent data and explicit rollback
        run: |
          set -euo pipefail
          oldenv="$RUNNER_TEMP/container-old.env"; newenv="$RUNNER_TEMP/container-new.env"
          secret_dir="$RUNNER_TEMP/container-upgrade-secrets"
          dc() { docker compose --project-name forum-container-upgrade --env-file "$oldenv" -f deploy/container/compose.yaml "$@"; }
          op() { python deploy/container/update.py "$@" --project forum-container-upgrade --old-env "$oldenv" --new-env "$newenv" --state-dir "$RUNNER_TEMP/container-upgrade-state" --ca "$secret_dir/tls.crt"; }
          smoke() { python deploy/container/smoke.py --domain forum.test --port 18443 --ca "$secret_dir/tls.crt" --email container-admin@example.invalid --password-file "$secret_dir/admin-password" --state "$RUNNER_TEMP/container-upgrade-smoke.json" "$@"; }
          dc up -d gateway
          smoke --version "$FORUM_COMPOSE_BASELINE"
          op apply --dry-run
          smoke --version "$FORUM_COMPOSE_BASELINE" --verify-only
          op apply
          smoke --version ${FORUM_CURRENT_VERSION} --verify-only
          op status
          op rollback --yes
          smoke --version "$FORUM_COMPOSE_BASELINE" --verify-only
          op status
      - name: Stop disposable project
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/container-old.env" ]; then
            docker compose --project-name forum-container-upgrade --env-file "$RUNNER_TEMP/container-old.env" -f deploy/container/compose.yaml logs --tail=50 init app worker scheduler gateway || true
            docker compose --project-name forum-container-upgrade --env-file "$RUNNER_TEMP/container-old.env" -f deploy/container/compose.yaml down -v --remove-orphans
          fi
  backup-s3:
    needs: [release-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sodium, mbstring, zip, gd, dom, xml, xmlwriter, curl, openssl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forum-signed-candidate
          path: ${{ runner.temp }}/forum-current
      - name: Install trusted release verifier dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Encrypted multipart backup and exact object rotation over TLS
        run: |
          set -euo pipefail
          aws --version
          work="$RUNNER_TEMP/forum-backup-s3"
          mkdir -p "$work/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 -keyout "$work/certs/private.key" -out "$work/certs/public.crt"
          export AWS_ACCESS_KEY_ID=forum-backup-ci
          export AWS_SECRET_ACCESS_KEY=$(openssl rand -hex 24)
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          export AWS_DEFAULT_REGION=us-east-1 AWS_EC2_METADATA_DISABLED=true AWS_CA_BUNDLE="$work/certs/public.crt"
          export AWS_CONFIG_FILE="$work/aws-config"
          printf '[default]\nregion = us-east-1\ns3 =\n    addressing_style = path\n    multipart_threshold = 8MB\n    multipart_chunksize = 8MB\n' > "$AWS_CONFIG_FILE"
          # The former quay.io/minio/minio image is no longer publicly accessible.
          # Use a real S3-compatible HTTPS service with isolated disposable credentials.
          python3 - <<'PY_S3_CONFIG'
          import json,os
          with open(os.environ['AWS_CONFIG_FILE']+'.s3.json','w') as out:
              json.dump({'identities':[{'name':'forum-ci','credentials':[{'accessKey':os.environ['AWS_ACCESS_KEY_ID'],'secretKey':os.environ['AWS_SECRET_ACCESS_KEY']}],'actions':['Admin','Read','Write','List','Tagging']}]},out)
          PY_S3_CONFIG
          # Run the disposable S3 server with the runner UID, not root, so
          # both its private TLS key and IAM credentials remain mode 0600.
          # The only writable container data is an isolated test directory.
          mkdir -p -m 0700 "$work/data"
          chmod 0700 "$work" "$work/data"
          chmod 0600 "$AWS_CONFIG_FILE.s3.json" "$work/certs/private.key"
          docker run -d --name forum-backup-s3 --user "$(id -u):$(id -g)" -p 127.0.0.1:19000:9000 \
            -v "$work/data:/data" -v "$work/certs:/certs:ro" -v "$AWS_CONFIG_FILE.s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.38 server -dir=/data -s3 -s3.port=8333 -s3.port.https=9000 \
            -s3.cert.file=/certs/public.crt -s3.key.file=/certs/private.key -s3.config=/etc/seaweedfs/s3.json
          export CE_BACKUP_TEST_ENDPOINT=https://127.0.0.1:19000 CE_BACKUP_TEST_BUCKET=forum-backup-ci
          for i in $(seq 1 45); do
            if aws --endpoint-url "$CE_BACKUP_TEST_ENDPOINT" s3 ls >/dev/null 2>&1; then break; fi
            if [ "$i" = 45 ]; then docker logs forum-backup-s3 >&2; exit 1; fi
            sleep 2
          done
          aws --endpoint-url "$CE_BACKUP_TEST_ENDPOINT" s3 mb "s3://$CE_BACKUP_TEST_BUCKET"
          php tools/backup-automation-regression.php --s3
          # Fresh namespace/bucket for the full physical DR path; never a production object.
          aws --endpoint-url "$CE_BACKUP_TEST_ENDPOINT" s3 mb s3://forum-dr-ci
          export FORUM_DR_DISPOSABLE=destroy-test-services
          mkdir -p storage/tmp/forum-ci/dr-s3
          python3 tools/forum-tests/dr_certification.py \
            --driver sqlite --transport s3 \
            --s3-endpoint "$CE_BACKUP_TEST_ENDPOINT" --s3-bucket forum-dr-ci \
            --release-dir "$RUNNER_TEMP/forum-current" \
            --trusted-public-key "$RUNNER_TEMP/forum-current/ci-release.pub" \
            --report storage/tmp/forum-ci/dr-s3/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-dr096-s3-evidence
          path: storage/tmp/forum-ci/dr-s3/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove disposable S3 service
        if: always()
        run: docker rm -f forum-backup-s3 || true
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, sodium, zip
          coverage: none
      - run: python deploy/monitoring/test_monitoring.py --integration
  staging:
    needs: [release-candidate, release, production-host, container-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    # The physical acceptance suite sends verification and subscription mail
    # through SMTP 1025, then inspects the captured messages via HTTP 8025.
    # Match the disposable Mailpit service used by the passing release matrix.
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forum-signed-candidate
          path: ${{ runner.temp }}/forum-staging-candidate
      - uses: actions/download-artifact@v4
        with:
          name: forum-production-host-evidence
          path: ${{ runner.temp }}/forum-staging-host
      - name: Clean disposable staging install and complete live HTTP/ACL/media/FTS/recovery admission
        run: |
          set -euo pipefail
          # Both transports must be ready before the first email-verification
          # request. Keep the signed dist and real email checks unchanged.
          python3 - <<'PY_MAILPIT'
          import json, socket, time, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(60):
              try:
                  with socket.create_connection(('127.0.0.1', 1025), timeout=2):
                      pass
                  with opener.open('http://127.0.0.1:8025/api/v1/messages', timeout=2) as response:
                      if response.status != 200 or not isinstance(json.load(response), dict):
                          raise RuntimeError('Mailpit API is not ready')
                  print('PASS staging disposable SMTP and Mailpit API', flush=True)
                  break
              except (OSError, ValueError, RuntimeError) as exc:
                  if attempt == 59:
                      raise RuntimeError('Staging Mailpit unavailable on ports 1025/8025') from exc
                  time.sleep(1)
          PY_MAILPIT
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          dir="$RUNNER_TEMP/forum-staging-candidate"
          php tools/verify-signed-release.php "$dir" "$dir/ci-release.pub"
          mkdir -p "$RUNNER_TEMP/forum-staging/logs"
          python3 tools/forum-tests/release_acceptance.py --driver sqlite \
            --artifact "$dir/cajeerengine-${FORUM_CURRENT_VERSION}-dist.zip" \
            --report "$RUNNER_TEMP/forum-staging/logs" | tee "$RUNNER_TEMP/forum-staging/stdout.log"
      - name: Witness signed dist against separate physical Nginx/TLS/PostgreSQL host and stage checks
        run: |
          set -euo pipefail
          python3 tools/staging-gate.py \
            --candidate "$RUNNER_TEMP/forum-staging-candidate" \
            --trusted-public-key "$RUNNER_TEMP/forum-staging-candidate/ci-release.pub" \
            --host "$RUNNER_TEMP/forum-staging-host/production-acceptance.json" \
            --stdout "$RUNNER_TEMP/forum-staging/stdout.log" \
            --logs "$RUNNER_TEMP/forum-staging/logs" \
            --version "$FORUM_CURRENT_VERSION" --commit "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/forum-staging/staging-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forum-final-staging-evidence
          path: ${{ runner.temp }}/forum-staging/staging-acceptance.json
          if-no-files-found: error
          retention-days: 90
  certification:
    needs: [release-candidate, test, postgres, mysql-search, browser, release, production-host, container-runtime, container-upgrade, backup-s3, monitoring, staging]
    # A certificate is meaningful only if every upstream matrix completed.
    # Failed predecessors remain visible through the forum-required aggregate.
    if: ${{ always() && needs.staging.result == 'success' && needs.test.result == 'success' && needs.postgres.result == 'success' && needs['mysql-search'].result == 'success' && needs.browser.result == 'success' && needs.release.result == 'success' && needs['production-host'].result == 'success' && needs['container-runtime'].result == 'success' && needs['container-upgrade'].result == 'success' && needs['backup-s3'].result == 'success' && needs.monitoring.result == 'success' && needs['release-candidate'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forum-signed-candidate
          path: ${{ runner.temp }}/forum-certification
      - uses: actions/download-artifact@v4
        with:
          name: forum-production-host-evidence
          path: ${{ runner.temp }}/forum-host-evidence
      - uses: actions/download-artifact@v4
        with:
          name: forum-release-sqlite-evidence
          path: ${{ runner.temp }}/forum-dr-raw/sqlite
      - uses: actions/download-artifact@v4
        with:
          name: forum-release-pg17-evidence
          path: ${{ runner.temp }}/forum-dr-raw/pg17
      - uses: actions/download-artifact@v4
        with:
          name: forum-release-pg18-evidence
          path: ${{ runner.temp }}/forum-dr-raw/pg18
      - uses: actions/download-artifact@v4
        with:
          name: forum-dr096-s3-evidence
          path: ${{ runner.temp }}/forum-dr-raw/s3
      - uses: actions/download-artifact@v4
        with:
          name: forum-final-staging-evidence
          path: ${{ runner.temp }}/forum-staging-evidence
      - name: Aggregate real GitHub Actions jobs and seal exact signed release
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/forum-certification"
          cp "$RUNNER_TEMP/forum-host-evidence/production-acceptance.json" "$dir/production-acceptance.json"
          cp "$RUNNER_TEMP/forum-staging-evidence/staging-acceptance.json" "$dir/staging-acceptance.json"
          cp "$RUNNER_TEMP/forum-dr-raw/sqlite/dr096-sqlite/result.json" "$dir/dr-sqlite.json"
          cp "$RUNNER_TEMP/forum-dr-raw/pg17/dr096-pg17/result.json" "$dir/dr-pg17.json"
          cp "$RUNNER_TEMP/forum-dr-raw/pg18/dr096-pg18/result.json" "$dir/dr-pg18.json"
          cp "$RUNNER_TEMP/forum-dr-raw/s3/result.json" "$dir/dr-s3.json"
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/forum-needs.json"
          python tools/collect-ci-jobs.py "$dir/ci-jobs.json" "$RUNNER_TEMP/forum-needs.json"
          python tools/certification-evidence.py seal "$dir"
          python tools/certification-evidence.py verify "$dir"
          python tools/final-audit.py --directory "$dir" --trusted-public-key "$dir/ci-release.pub" --version "$FORUM_CURRENT_VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forum-certified-release
          path: ${{ runner.temp }}/forum-certification/
          if-no-files-found: error
          retention-days: 30
  forum-required:
    runs-on: ubuntu-24.04
    if: always()
    needs: [release-candidate, test, postgres, mysql-search, browser, release, production-host, container-runtime, container-upgrade, backup-s3, monitoring, staging, certification]
    steps:
      - name: Require every test matrix to pass
        env:
          SQLITE: ${{ needs.test.result }}
          POSTGRES: ${{ needs.postgres.result }}
          MYSQL: ${{ needs.mysql-search.result }}
          BROWSER: ${{ needs.browser.result }}
          RELEASE: ${{ needs.release.result }}
          HOST: ${{ needs.production-host.result }}
          CONTAINERS: ${{ needs.container-runtime.result }}
          CONTAINER_UPGRADE: ${{ needs.container-upgrade.result }}
          BACKUP_S3: ${{ needs.backup-s3.result }}
          MONITORING: ${{ needs.monitoring.result }}
          STAGING: ${{ needs.staging.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
          CERTIFICATION: ${{ needs.certification.result }}
        run: |
          test "$SQLITE" = success
          test "$POSTGRES" = success
          test "$MYSQL" = success
          test "$BROWSER" = success
          test "$RELEASE" = success
          test "$HOST" = success
          test "$CONTAINERS" = success
          test "$CONTAINER_UPGRADE" = success
          test "$BACKUP_S3" = success
          test "$MONITORING" = success
          test "$STAGING" = success
          test "$RELEASE_CANDIDATE" = success
          test "$CERTIFICATION" = success
