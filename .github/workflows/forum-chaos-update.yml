name: Forum 1.5.9 physical interrupted signed update
on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful main CI run ID for the exact signed candidate
        type: string
        required: true
      checkpoint:
        description: Durable state where the host updater is SIGKILLed; reset the disposable old-release fixture between runs
        type: choice
        required: true
        options: [drained, activating]
env:
  FORUM_CHAOS_TARGET: ${{ '1.5.9' }}
permissions:
  contents: read
  actions: read
concurrency:
  group: forum-physical-certification
  cancel-in-progress: false
jobs:
  interrupted-update:
    runs-on: [self-hosted, linux, x64, forum-benchmark]
    environment: forum-load-certification
    timeout-minutes: 45
    env:
      CE_CHAOS_PROJECT: ${{ vars.CE_CHAOS_PROJECT }}
      CE_CHAOS_OLD_ENV: ${{ vars.CE_CHAOS_OLD_ENV }}
      CE_CHAOS_NEW_ENV: ${{ vars.CE_CHAOS_NEW_ENV }}
      CE_CHAOS_CA: ${{ vars.CE_CHAOS_CA }}
      CE_CHAOS_SMOKE_STATE: ${{ vars.CE_CHAOS_SMOKE_STATE }}
      CE_CHAOS_STATE_DIR: ${{ vars.CE_CHAOS_STATE_DIR }}
      CE_CHAOS_SIGNED_DIR: ${{ runner.temp }}/forum-canonical-candidate
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_CI_RUN: ${{ inputs.ci_run }}
      CE_CHAOS_BASELINE_DIST: ${{ vars.CE_CHAOS_BASELINE_DIST }}
      CE_CHAOS_TRUSTED_PUB: ${{ vars.CE_CHAOS_TRUSTED_PUB }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the exact successful signed CI candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_CI_RUN" =~ ^[1-9][0-9]*$ ]]
          python3 tools/qualification-run.py fetch --ci-run "$QUALIFICATION_CI_RUN" --directory "$CE_CHAOS_SIGNED_DIR" --trusted-key "$CE_CHAOS_TRUSTED_PUB" --version "$FORUM_CHAOS_TARGET"
      - name: Prepare independently trusted signed candidate for a dedicated disposable old-release site
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CE_CHAOS_PROJECT" =~ ^[a-z0-9_-]*[-_]chaos([-_][a-z0-9_-]*)?$ ]]
          for name in CE_CHAOS_OLD_ENV CE_CHAOS_NEW_ENV CE_CHAOS_CA CE_CHAOS_STATE_DIR CE_CHAOS_SMOKE_STATE CE_CHAOS_SIGNED_DIR CE_CHAOS_TRUSTED_PUB CE_CHAOS_BASELINE_DIST; do
            test -n "${!name}" && test -e "${!name}"
          done
          test -d "$CE_CHAOS_STATE_DIR" && test ! -L "$CE_CHAOS_STATE_DIR"
          test "$(stat -c '%a' "$CE_CHAOS_STATE_DIR")" = 700
          test ! -e "$CE_CHAOS_STATE_DIR/update.json"
          test "$(sed -n 's/^CE_RELEASE_VERSION=//p' "$CE_CHAOS_OLD_ENV")" = 1.5.2
          test "$(sed -n 's/^CE_RELEASE_VERSION=//p' "$CE_CHAOS_NEW_ENV")" = "$FORUM_CHAOS_TARGET"
          php tools/verify-signed-release.php "$CE_CHAOS_SIGNED_DIR" "$CE_CHAOS_TRUSTED_PUB"
          artifact="$CE_CHAOS_SIGNED_DIR/cajeerengine-${FORUM_CHAOS_TARGET}-dist.zip"
          sha="$(sha256sum "$artifact" | cut -d' ' -f1)"
          test "$(sed -n 's/^CE_RELEASE_SHA256=//p' "$CE_CHAOS_NEW_ENV")" = "$sha"
          sh deploy/container/prepare.sh "$artifact" "$CE_CHAOS_TRUSTED_PUB" "$sha" "$FORUM_CHAOS_TARGET"
      - name: Crash a real update after its durable checkpoint, then invoke the production recovery operator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forum-chaos"
          python3 deploy/container/chaos_update.py \
            --project "$CE_CHAOS_PROJECT" --disposable destroy-test-services \
            --old-env "$CE_CHAOS_OLD_ENV" --new-env "$CE_CHAOS_NEW_ENV" \
            --state-dir "$CE_CHAOS_STATE_DIR" --ca "$CE_CHAOS_CA" --state "$CE_CHAOS_SMOKE_STATE" \
            --baseline-dist "$CE_CHAOS_BASELINE_DIST" --signed-dist "$CE_CHAOS_SIGNED_DIR/cajeerengine-${FORUM_CHAOS_TARGET}-dist.zip" --trusted-key "$CE_CHAOS_TRUSTED_PUB" \
            --checkpoint '${{ inputs.checkpoint }}' \
            --report "$RUNNER_TEMP/forum-chaos/recovery.json"
      - name: Bind recovery evidence to current GitHub run attempt and exact candidate
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: python3 tools/qualification-run.py receipt --kind "$CHECKPOINT" --directory "$CE_CHAOS_SIGNED_DIR" --version "$FORUM_CHAOS_TARGET" --reports "$RUNNER_TEMP/forum-chaos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-physical-interrupted-update-${{ inputs.checkpoint }}
          path: ${{ runner.temp }}/forum-chaos/*.json
          if-no-files-found: warn
          retention-days: 90
